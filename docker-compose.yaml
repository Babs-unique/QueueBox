services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-queuebox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queuebox}
      POSTGRES_DB: ${DB_NAME:-queuebox}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
      target: builder
    command: ["npm", "run", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-queuebox}:${DB_PASSWORD:-queuebox}@db:5432/${DB_NAME:-queuebox}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-queuebox}:${DB_PASSWORD:-queuebox}@db:5432/${DB_NAME:-queuebox}?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8443
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-only-change-this-refresh-secret}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-change-this-cookie-secret}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: production
    command: ["npm", "run", "start:worker:prod"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-queuebox}:${DB_PASSWORD:-queuebox}@db:5432/${DB_NAME:-queuebox}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-only-change-this-refresh-secret}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-change-this-cookie-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      PORT: 8443
      VITE_API_URL: http://localhost:3000
    ports:
      - "8443:8443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
